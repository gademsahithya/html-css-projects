<!DOCTYPE html>
<html>
  <head>
<style>
  .div{
    position: fixed;
    width: 320px;
    height: 180px;
    bottom: 10px;
    right: 10px;
    background-color: gray;
  }
  .x{
    height: 45px;
    width: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: black;
    color: white;
    position: absolute;
    top: -10px;
    left: -10px;
    border-radius: 25px;
    font-size: 25px;
  }
  .time{
    background-color: black;
    color: white;
    
    font-size: 14px;
    font-weight: bold;
    position: absolute;
    bottom: 10px;
    right: 10px;
    padding-right: 5px;
    padding-left: 5px;
    padding-bottom: 5px;
    padding-top: 5ox;
  }
</style>
  </head>
  <body style="height: 3000px;">
   <div class="div">
<div class="x">x</div>
   
   <div class="time">0:29</div>
   </div>
  </body>
</html>
