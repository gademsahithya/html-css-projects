<!DOCTYPE html>
<html>
  <head>
    <title>
      revision 2
    </title>
    <style>
      .google{
        margin-left: 150px;
        margin-bottom: 12px;
        display: block;
        margin-top: 10px;
        width: 200px;
        object-position: center;
      }
      .oops{
        width: 500px;
        border-radius:30px;
       padding: 12px 16px 12px 16px;
        border: none;
        box-shadow: 0 1px 6px rgba(0,0,0,0.2);
        font-size: 14px;
        display: block;
        margin-bottom: 20px;
      }
      .ride{
        font-size: 30px;
        font-weight: 300;
        color: black;
        margin-bottom: 20px;
        font-family: arial;

      }
      .input{
        padding: 12px 200px 12px 16px;
        font-size: 14px;
       margin-bottom: 5px;
       display: block;
       border: none;
       background-color: rgb(240, 240 ,240);
      }
      .text{
        padding: 12px 200px 12px 16px;
        font-size: 14px;
        display: block;
        margin-bottom: 30px;
        border: none;
        background-color: rgb(240, 240 ,240);
      }
      .Request{
       font-size: 16px;
        color: white;
        background-color: black;
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 30px;
        padding-right: 30px;
        border: none;
        margin-right: 20px;
        
      }
      .schedule{
       font-size: 16px;
        color: black;
        background-color: rgb(240, 240, 240);
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 30px;
        padding-right: 30px;
        border: none;
        margin-right: 20px;
         
      }
    </style>
    </head>
    <body>
       <img class="google" src="pictures/images.png">
       <input  class="oops" type="text" placeholder="Search Google or type a URL">
       <p class="ride">Request a ride now</p>
       <input class="input" type="text" placeholder="Enter pickup location">
       <input class="text" type="text" placeholder="Enter destination">
       <button class="Request">Request now</button>
       <button class="schedule">Schedule for later</button>
       
    </body>
  
</html>
