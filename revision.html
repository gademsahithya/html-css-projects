<!DOCTYPE html>>
<html>
  <head>
    <title>
      Revision 
    </title>
    <style>
      .back,.next{
        padding: 5px 5px 5px 5px;
margin-bottom: 10px;
      }
      .number{
        color: blue;
        text-decoration: underline;
        margin: 0 7px 0 7px;
      }
      .stretch{
        color: white;
        background-color: green;
        font-size: 20px;
        font-weight: bold;
        padding: 10px 10px 10px 10px;
display: block;
transition: padding 20;
      }
      .stretch:hover{
        padding: 20px 20px 20px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button class="back"> Back</button>
    <a class="number">1</a>
  <a class="number">2</a>
 <a class="number">3</a>
                <a class="number">4</a>
                    <a class="number">5</a>
  <button class="next">Next</button>
  <button class="stretch" >stretch</button>
  
  </body>
</html>
